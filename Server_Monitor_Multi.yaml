name: "服务器监控(多台)"
description: "通过 SSH 获取多台服务器状态+流量，支持所有 Widget 尺寸"

env_schema:
  hosts:
    name: 主机列表
    description: "格式: 名称:IP,名称:IP (如 RN-SJC:23.94.70.211,CN01:39.98.71.108)"
    default_value: ""
  port:
    name: 端口
    description: SSH 端口号
    default_value: "22"
  username:
    name: 用户名
    description: SSH 登录用户名
    default_value: "root"
password: <redacted>
    name: 密码
    description: "SSH 密码（与私钥二选一）"
    default_value: ""
  privateKey:
    name: 私钥
    description: "SSH 私钥（与密码二选一）"
    default_value: ""

scriptings:
- generic:
    name: 服务器监控(多台)
    script_url: https://cdn.jsdelivr.net/gh/Servant9527/Surge@cda258f10ea414676015426bffb6e05b0359e588/server-monitor-multi.js

widgets:
- name: 服务器监控(多台)
  script_name: 服务器监控(多台)
